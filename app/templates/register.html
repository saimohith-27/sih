{% extends 'base.html' %}

{% block title %}Register | Capacity Connect{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h2 class="mb-3">Create account</h2>
          <form method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full name</label>
                <input type="text" class="form-control" name="full_name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Role</label>
                <select class="form-select" name="role">
                  <option value="trainee">Trainee</option>
                  <option value="trainer">Trainer</option>
                </select>
              </div>
            </div>
            <div class="alert alert-info mt-3 mb-0">
              Supabase Auth will be used when the project is configured, and the demo mode remains as a safe fallback during setup.
            </div>
            <button class="btn btn-primary w-100 mt-4">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
