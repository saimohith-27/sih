{% extends 'base.html' %}
{% block title %}All Courses | Capacity Connect{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="mb-4">Browse Courses</h1>
  <div class="row g-4">
    {% for course in courses %}
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100 p-4">
        <span class="badge bg-primary-subtle text-primary mb-2">{{ course.subject }}</span>
        <h5>{{ course.title }}</h5>
        <p class="text-secondary mb-3">Duration: {{ course.duration }}</p>
        <a href="{{ url_for('courses.detail', course_id=course.title.lower().replace(' ', '-')) }}" class="btn btn-outline-primary">View details</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
